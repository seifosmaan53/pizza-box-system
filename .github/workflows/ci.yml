name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    env:
      # The unit suite is pure — no database is touched — but Prisma Client still needs
      # a DATABASE_URL present to generate, and the JWT module reads its secrets at
      # import time. These are throwaway CI values, not credentials.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pizzabox_test
      JWT_SECRET: ci-access-secret-not-used-anywhere-real
      JWT_REFRESH_SECRET: ci-refresh-secret-different-from-access
      NODE_ENV: test
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --ci

  client:
    name: Client (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this gates on types as well.
      - name: Type-check + build
        run: npm run build

      - name: Tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Reported, not gating: a transitive advisory in a dev dependency should not block
      # a merge, but it should be visible in the run log.
      - name: Server audit
        working-directory: ./server
        run: npm audit --audit-level=high || true
      - name: Client audit
        working-directory: ./client
        run: npm audit --audit-level=high || true
